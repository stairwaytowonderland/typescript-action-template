# https://github.com/actions/starter-workflows/blob/main/code-scanning/codeql.yml
# https://github.com/actions/reusable-workflows/blob/main/.github/workflows/codeql-analysis.yml
# This workflow uses the CodeQL Action to analyze code for security vulnerabilities and errors.
# The file extension must be .yml for CodeQL to recognize it.
name: 🚦 Code Quality (CodeQL)

on:
  schedule:
    - cron: '31 7 * * 2'
      timezone: America/Chicago
  pull_request:
    # The branches below must be a subset of the on.push branches
    branches:
      - main
    paths-ignore:
      # Exclude all root-level hidden directories and files (except .github)
      - '.devcontainer/**'
      - '.licenses/**'
      - '.vscode/**'

      # Other asset and documentation exclusions
      - 'badges/**'
      - '**/docs/**'
      - '**/*.md'
      - '**/*.rst'
      - 'LICENSE'
  push:
    branches:
      - main
    paths-ignore:
      # Exclude all root-level hidden directories and files (except .github)
      - '.devcontainer/**'
      - '.licenses/**'
      - '.vscode/**'

      # Other asset and documentation exclusions
      - 'badges/**'
      - '**/docs/**'
      - '**/*.md'
      - '**/*.rst'
      - 'LICENSE'

permissions:
  contents: read

jobs:
  check-changed:
    name: Check Changed Files
    uses: stairwaytowonderland/.github/.github/workflows/check-changed.yaml@v1
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
    with:
      paths: |
        **/src/**
        package*.json
        action.y*ml

  codeql-analysis:
    needs: [check-changed]
    if: |
      needs.check-changed.outputs.result == 'true' && (
        github.event_name == 'pull_request' || (
          github.event_name == 'push' &&
          github.actor != 'github-actions[bot]' &&
          github.actor != 'dependabot[bot]' &&
          github.actor != 'renovate[bot]' &&
          github.actor != 'semantic-release[bot]' &&
          github.actor != 'semantic-release-bot'))
    uses: actions/reusable-workflows/.github/workflows/codeql-analysis.yml@main
    permissions:
      actions: read
      contents: read
      security-events: write
    with:
      languages: '["typescript"]'
      codeql-cfg-path: '.github/codeql/codeql-config.yml'
