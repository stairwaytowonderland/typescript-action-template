name: 📖 Deploy Docs

on:
  push:
    branches:
      - main # Change this to 'master' if your default branch uses the old naming
    paths:
      - '.github/workflows/docs.yaml'
      - 'typedoc.site.json'
      - 'src/**/*.ts'

# Set minimum required permissions for the workflow
permissions:
  contents: read

# Allow one concurrent deployment
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    name: 🌐 Deploy GitHub Pages Site
    permissions:
      contents: read
      pages: write
      # Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Generate Typedoc Site
        run: npm run build:docs

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Build Artifacts
        uses: actions/upload-pages-artifact@v5
        with:
          # This must match the `outputs.path` directory in your typedoc.site.json
          path: './docs-site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
