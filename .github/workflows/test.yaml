name: 🔔 CI Tests

on:
  # pull_request:
  #   branches:
  #     - main
  #   paths:
  #     # - '.github/**'
  #     - 'src/**'
  #     - 'package*json'
  #     - 'action.yaml'
  # push:
  #   branches:
  #     - main
  #   paths:
  #     # - '.github/**'
  #     - 'src/**'
  #     - 'package*json'
  #     - 'action.yaml'
  workflow_call:
    inputs:
      milliseconds:
        description: 'Milliseconds to wait'
        type: number
        default: 2000
  workflow_dispatch:
    inputs:
      milliseconds:
        description: 'Milliseconds to wait'
        type: number
        default: 2000

permissions:
  contents: read # access to read repository's content
  actions: read # access to reading actions

jobs:
  basic-validation:
    name: Basic Validation
    uses: actions/reusable-workflows/.github/workflows/basic-validation.yml@main
    with:
      operating-systems: '["ubuntu-latest"]'
      enable-audit: false

  test-action:
    name: GitHub Actions Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        id: checkout
        uses: actions/checkout@v7

      - name: Test Local Action
        id: test-action
        uses: ./
        with:
          milliseconds: ${{ inputs.milliseconds }}

      - name: Print Output
        id: output
        run: echo "${{ steps.test-action.outputs.time }}"
