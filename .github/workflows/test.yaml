name: 🔔 CI Tests

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/**'
      - '**/src/**'
      - 'package*.json'
      - 'action.y*ml'
  # push:
  #   branches:
  #     - main
  #   paths:
  #     # - '.github/**'
  #     - '**/src/**'
  #     - 'package*json'
  #     - 'action.yaml'
  workflow_call:
    inputs:
      milliseconds:
        description: 'Milliseconds to wait'
        type: number
        default: 2000
  workflow_dispatch:
    inputs:
      milliseconds:
        description: 'Milliseconds to wait'
        type: number
        default: 2000

permissions:
  contents: read

jobs:
  check-workflow:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      is_workflow_call: ${{ steps.check-job.outputs.is_workflow_call }}
    steps:
      - name: Step for Reusable Workflow Only
        id: check-job
        env:
          IS_WORKFLOW_CALL: ${{ github.workflow_ref != job.workflow_ref }}
        run: echo "is_workflow_call=${IS_WORKFLOW_CALL}" >> $GITHUB_OUTPUT

  check-changed:
    name: Check Changed Files
    needs: check-workflow
    if: |
      needs.check-workflow.outputs.is_workflow_call != 'true' &&
        (github.event_name == 'pull_request' ||
        (github.event_name == 'push' && ! startsWith(github.ref, 'refs/tags/')))
    uses: stairwaytowonderland/.github/.github/workflows/check-changed.yaml@v1
    permissions:
      contents: read
    with:
      paths: |
        .github/**
        **/src/**
        package*.json
        action.y*ml
      ignore-authors: |
        github-actions[bot]
        semantic-release-bot

  basic-validation:
    name: Basic Validation
    needs: [check-workflow, check-changed]
    if: always() && (needs.check-workflow.outputs.is_workflow_call == 'true' || needs.check-changed.outputs.result == 'true')
    uses: actions/reusable-workflows/.github/workflows/basic-validation.yml@main
    permissions:
      contents: read
    with:
      operating-systems: '["ubuntu-latest"]'
      enable-audit: false

  test-action:
    name: GitHub Actions Test
    needs: [check-workflow, check-changed]
    if: always() && (needs.check-workflow.outputs.is_workflow_call == 'true' || needs.check-changed.outputs.result == 'true')
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        id: checkout
        uses: actions/checkout@v7

      - name: Test Local Action
        id: test-action
        uses: ./
        with:
          milliseconds: ${{ inputs.milliseconds || 1000 }}

      - name: Print Output
        id: output
        run: echo "${{ steps.test-action.outputs.time }}"
