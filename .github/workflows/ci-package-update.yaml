name: 🔂 CI Package Updates

on:
  push:
    branches:
      - main
    paths:
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

jobs:
  package-update:
    name: Update packages
    # concurrency:
    #   group: ${{ github.repository_id }}-${{ github.ref }}
    #   cancel-in-progress: false
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write
    uses: stairwaytowonderland/.github/.github/workflows/ci-package-update.yaml@v1
    with:
      ignore-events: ''
    secrets: inherit

