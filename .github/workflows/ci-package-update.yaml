name: 🔂 CI Package Updates

on:
  push:
    branches: [main]
    # paths:
    #   - 'package.json'
    #   - 'package-lock.json'

concurrency:
  group: '${{ github.repository_id }}-${{ github.ref_name }}'
  cancel-in-progress: false

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

jobs:
  package-update:
    name: Update packages
    uses: stairwaytowonderland/.github/.github/workflows/ci-package-update.yaml@v1
    secrets: inherit

  status-sync:
    runs-on: ubuntu-latest
    needs: package-update
    # Runs even if package-update is canceled/skipped
    if: always()
    steps:
      - name: Mark as Success
        run: echo "Workflow handled by concurrency or completed."
