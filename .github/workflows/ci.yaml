# Use PAT instead of GITHUB_TOKEN to cause semantic-release to trigger tag pipeline when tag is created.
# 'Fine-grained token' repo permissions: Contents

# * 1. Identity
name: 🔄 CI
run-name: CI on ${{ github.ref_name }} triggered by @${{ github.actor }}

# * 2. Trigger Events
on:
  push:
    branches:
      - main
    paths-ignore:
      - 'CHANGELOG.md'
      - 'package.json'
      - 'package-lock.json'

    tags:
      - 'v*'

  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to publish (e.g. v1.2.3)'
        type: string
        default: '' # checkov:skip=CKV_GHA_7: Tag required for automated dispatch, which is used for the first tag/release
      notes-b64:
        description: 'Base64-encoded release notes (Markdown)'
        type: string
        default: '' # checkov:skip=CKV_GHA_7: Release notes required for automated dispatch, which is used for the first tag/release

# * 3. Global Security & Concurrency
permissions:
  contents: read

# concurrency:
#   group: ${{ github.run_id }}
#   cancel-in-progress: false

# * 4. Global Variables & Configuration
# env:
#   DRY_RUN: ${{ format('{0}', inputs.dry-run == 'true') }}

defaults:
  run:
    shell: bash

# * 5. Job Execution
jobs:
  check-changed:
    name: 📁 Check Changed Files
    uses: stairwaytowonderland/.github/.github/workflows/check-changed.yaml@v1
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'push' }}
    permissions:
      contents: read
    with:
      paths: |
        **/src/**
        action.y*ml

  info:
    name: 🪏 Gather Info
    needs: [check-changed]
    if: needs.check-changed.outputs.result == 'true'
    uses: stairwaytowonderland/.github/.github/workflows/ci-meta.yaml@v1
    permissions:
      contents: read
    with:
      publish: ${{ (github.event_name == 'workflow_dispatch' && (inputs.tag != '' && inputs.notes-b64 != '')) || startsWith(github.ref, 'refs/tags/') }}

  test:
    name: 🔔 Run Action Tests
    needs: [info]
    if: needs.info.outputs.is-release-workflow == 'true'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/test.yaml
    secrets: inherit

  check-dist:
    name: 🏗️ Check Transpiled JavaScript
    needs: [info]
    if: needs.info.outputs.is-release-workflow == 'true'
    uses: ./.github/workflows/check-dist.yaml

  release:
    name: 🚀 Release a New Version
    needs: [info, test, check-dist]
    uses: stairwaytowonderland/.github/.github/workflows/release.yaml@v1
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write
    with:
      dispatch-workflow: ${{ needs.info.outputs.has-release-tags != 'true' && 'ci.yaml' || '' }}
    secrets: inherit

  publish:
    name: 📦 Publish Release
    needs: [info]
    if: needs.info.outputs.is-publish-workflow == 'true' && ! github.event.repository.is_template
    uses: stairwaytowonderland/.github/.github/workflows/publish.yaml@v1
    permissions:
      contents: write
    with:
      tag: ${{ inputs.tag }}
      notes-b64: ${{ inputs.notes-b64 }}
      normalize-majorver: true
    secrets: inherit

  # release-and-publish:
  #   name: Release and Publish
  #   uses: stairwaytowonderland/.github/.github/workflows/ci.yaml@v1
  #   with:
  #     first-release-dispatch-workflow: ci.yaml
  #     normalize-majorver: true
  #     # The following inputs are required in the workflow specified by first-release-dispatch-workflow (e.g. the ci.yaml in this case):
  #     tag: ${{ inputs.tag }}
  #     notes-b64: ${{ inputs.notes-b64 }}
