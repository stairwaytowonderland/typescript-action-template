# Use PAT instead of GITHUB_TOKEN to cause semantic-release to trigger tag pipeline when tag is created.
# 'Fine-grained token' repo permissions: Contents

# 1. Identity
name: 🔄 CI
# run-name: CI on ${{ github.ref_name }} triggered by @${{ github.actor }}

# 2. Trigger Events
on:
  push:
    branches:
      - main
    paths-ignore:
      - 'CHANGELOG.md'
      - 'package.json'
      - 'package-lock.json'

    tags:
      - 'v*'

  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to publish (e.g. v1.2.3)'
        type: string
        default: '' # checkov:skip=CKV_GHA_7: Tag required for automated dispatch, which is used for the first tag/release
      notes-b64:
        description: 'Base64-encoded release notes (Markdown)'
        type: string
        default: '' # checkov:skip=CKV_GHA_7: Release notes required for automated dispatch, which is used for the first tag/release

# 3. Global Security & Concurrency
permissions:
  contents: read

concurrency:
  group: ${{ github.repository_id }}-${{ github.ref }}
  cancel-in-progress: true

# 4. Global Variables & Configuration
env:
  CHECK_CHANGED: true

defaults:
  run:
    shell: bash

# 5. Job Execution
jobs:
  info:
    name: 🔎 Gather Info
    # concurrency:
    #   group: ${{ github.repository_id }}-${{ github.ref }}
    #   cancel-in-progress: false
    permissions:
      contents: read
    uses: stairwaytowonderland/.github/.github/workflows/ci-meta.yaml@v1
    with:
      publish: ${{ (github.event_name == 'workflow_dispatch' && (inputs.tag != '' && inputs.notes-b64 != '')) || startsWith(github.ref, 'refs/tags/') }}

  config:
    name: ⚙️ Configuration
    needs: [info]
    if: needs.info.outputs.is-release-workflow == 'true'
    runs-on: ubuntu-latest
    outputs:
      check-changed: ${{ steps.set-outputs.outputs.check-changed }}
    steps:
      - name: Set Outputs from Environment
        id: set-outputs
        env:
          CHECK_CHANGED: ${{ env.CHECK_CHANGED }}
        run: |
          echo "check-changed=${CHECK_CHANGED}" >> $GITHUB_OUTPUT

  changed:
    name: 📁 Check Changed Files
    needs: [info, config]
    if: needs.info.outputs.is-release-workflow == 'true' && needs.config.outputs.check-changed == 'true'
    uses: stairwaytowonderland/.github/.github/workflows/check-changed.yaml@v1
    with:
      paths: |
        action.y*ml
        **/src/**
        !**/src/**/typedoc*.json
        !**/src/**/badges/*
        !**/src/**/docs/**/*

  debug:
    name: 🐛 Debug
    needs: [info, config, changed]
    if: needs.info.outputs.is-release-workflow == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Print Environment Variables
        run: env
      - name: Print Action Test Conditionals
        env:
          IS_RELEASE_WORKFLOW: ${{ needs.info.outputs.is-release-workflow }}
          CHECK_CHANGED: ${{ needs.config.outputs.check-changed }}
          CHANGED_RESULT: ${{ needs.changed.outputs.result }}
          JOB_STATUS: ${{ job.status }}
        run: |
          echo "is-release-workflow: $IS_RELEASE_WORKFLOW"
          echo "check-changed: $CHECK_CHANGED"
          echo "changed result: $CHANGED_RESULT"
          echo "status: $JOB_STATUS"
          echo "expression result: $(( $IS_RELEASE_WORKFLOW && $CHECK_CHANGED && $CHANGED_RESULT ))"

  test:
    name: 🔔 Run Action Tests
    needs: [info, config, changed]
    if: |
      ${{ (needs.changed.outputs.result == 'true' ||
      (needs.config.outputs.check-changed != 'true' &&
        needs.changed.outputs.result != 'true' &&
        (!failure() && !cancelled()) || success())) &&
      needs.info.outputs.is-release-workflow == 'true' }}
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/test.yaml
    secrets: inherit

  check-dist:
    name: 🏗️ Check Transpiled JavaScript
    needs: [info, config, changed]
    if: |
      ${{ (needs.changed.outputs.result == 'true' ||
      (needs.config.outputs.check-changed != 'true' &&
        needs.changed.outputs.result != 'true' &&
        (!failure() && !cancelled()) || success())) &&
      needs.info.outputs.is-release-workflow == 'true' }}
    uses: ./.github/workflows/check-dist.yaml

  pre-commit:
    name: 🎨 Pre-commit Check
    needs: [info, config, changed]
    if: |
      ${{ (needs.changed.outputs.result != 'true' ||
      (needs.config.outputs.check-changed != 'true' &&
        needs.changed.outputs.result != 'true' &&
        (!failure() && !cancelled()) || success())) &&
      needs.info.outputs.is-release-workflow == 'true' }}
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/pre-commit.yaml
    secrets: inherit

  release:
    name: 🚀 Release a New Version
    needs: [info, config, changed, test, check-dist]
    if: |
      ${{ (needs.changed.outputs.result != 'true' ||
      (needs.config.outputs.check-changed != 'true' &&
        needs.changed.outputs.result != 'true' &&
        (!failure() && !cancelled()) || success())) &&
      needs.info.outputs.is-release-workflow == 'true' &&
      ! github.event.repository.is_template }}
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write
    uses: stairwaytowonderland/.github/.github/workflows/release.yaml@v1
    # with:
    #   dispatch-workflow: ${{ needs.info.outputs.has-release-tags != 'true' && 'ci.yaml' || '' }}
    secrets: inherit

  publish:
    name: 📦 Publish Release
    needs: [info]
    if: needs.info.outputs.is-publish-workflow == 'true' && ! github.event.repository.is_template
    permissions:
      contents: write
    uses: stairwaytowonderland/.github/.github/workflows/publish.yaml@v1
    with:
      tag: ${{ inputs.tag }}
      # tag: ${{ needs.release.outputs.new-release-git-tag }}
      notes-b64: ${{ inputs.notes-b64 }}
      # notes-b64: ${{ needs.release.outputs.new-release-notes-base64 }}
      normalize-majorver: true
    secrets: inherit

  # release-and-publish:
  #   name: Release and Publish
  #   uses: stairwaytowonderland/.github/.github/workflows/ci.yaml@v1
  #   with:
  #     first-release-dispatch-workflow: ci.yaml
  #     normalize-majorver: true
  #     # The following inputs are required in the workflow specified by first-release-dispatch-workflow (e.g. the ci.yaml in this case):
  #     tag: ${{ inputs.tag }}
  #     notes-b64: ${{ inputs.notes-b64 }}
  #   secrets: inherit
